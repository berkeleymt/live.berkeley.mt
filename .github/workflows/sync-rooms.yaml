# Pulls room assignments from ContestDojo into static/rooms.json and deploys if
# they changed. Run it from Actions → Sync rooms → Run workflow, or let the
# schedule do it. Needs the CONTESTDOJO_API_TOKEN repository secret.
name: Sync rooms

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # hourly; tighten to "*/10 * * * *" on tournament day

permissions:
  contents: write
  actions: write

concurrency:
  group: content-commit

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rooms from ContestDojo
        env:
          CONTESTDOJO_API_TOKEN: ${{ secrets.CONTESTDOJO_API_TOKEN }}
        run: |
          if [ -z "$CONTESTDOJO_API_TOKEN" ]; then echo "CONTESTDOJO_API_TOKEN secret is not set; skipping."; exit 0; fi
          python3 scripts/sync_rooms.py

      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- static/rooms.json; then echo "rooms.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/rooms.json
          git commit -m "rooms: sync from ContestDojo"
          git push
          gh workflow run build-and-push.yaml --ref main
