name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/berkeleymt/live.berkeley.mt
          flavor: latest=true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Restart deployment to pull the new :latest image
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n bmt rollout restart deployment/live
          if ! kubectl -n bmt rollout status deployment/live --timeout=120s; then
            # One replica on a ReadWriteOnce volume: a rolling update deadlocks whenever the new
            # pod lands on another node, since it can't attach /app/data while the old pod holds
            # it and the old pod is only removed once the new one is Ready. Hand the volume over
            # by scaling the old ReplicaSet to 0 (deleting its pod would only get it recreated).
            kubectl -n bmt get pods -l app=live -o wide
            rs=$(kubectl -n bmt get rs -l app=live --sort-by=.metadata.creationTimestamp -o name)
            hash=$(kubectl -n bmt get "$(echo "$rs" | tail -n 1)" -o jsonpath='{.metadata.labels.pod-template-hash}')
            events=$(kubectl -n bmt describe pods -l app=live,pod-template-hash="$hash" | sed -n '/^Events:/,$p')
            echo "$events"
            if ! echo "$events" | grep -q -E 'Multi-Attach|FailedAttachVolume'; then
              echo "The new pod is stuck for another reason, see its events above."; exit 1
            fi
            echo "$rs" | head -n -1 | xargs -r -n 1 kubectl -n bmt scale --replicas=0
            kubectl -n bmt rollout status deployment/live --timeout=180s
          fi

      - name: Give the pod its secrets (room lookup token, staff editor)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          CONTESTDOJO_API_TOKEN: ${{ secrets.CONTESTDOJO_API_TOKEN }}
          LIVE_ADMIN_PASSWORD: ${{ secrets.LIVE_ADMIN_PASSWORD }}
          LIVE_GITHUB_APP_ID: ${{ secrets.LIVE_GITHUB_APP_ID }}
          LIVE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.LIVE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          put() { # put NAME FILE: write secret $NAME into /app/data/$FILE in the pod, if set
            if [ -z "${!1}" ]; then echo "$1 secret not set; skipping $2."; return; fi
            printf '%s' "${!1}" | kubectl -n bmt exec -i deployment/live -- sh -c "umask 077 && cat > /app/data/$2"
          }
          put CONTESTDOJO_API_TOKEN contestdojo.token
          put LIVE_ADMIN_PASSWORD admin.password
          put LIVE_GITHUB_APP_ID github-app.id
          put LIVE_GITHUB_APP_PRIVATE_KEY github-app.pem
          kubectl -n bmt exec deployment/live -- rm -f /app/data/github.token
          kubectl -n bmt exec deployment/live -- python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:3001/api/health').read().decode())"
          kubectl -n bmt exec deployment/live -- python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:3001/admin/api/status').read().decode())"
