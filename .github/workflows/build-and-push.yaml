name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/berkeleymt/live.berkeley.mt
          flavor: latest=true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Restart deployment to pull the new :latest image
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n bmt rollout restart deployment/live
          kubectl -n bmt rollout status deployment/live --timeout=300s

      - name: Give the pod the ContestDojo token (room lookup)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          CONTESTDOJO_API_TOKEN: ${{ secrets.CONTESTDOJO_API_TOKEN }}
        run: |
          if [ -z "$CONTESTDOJO_API_TOKEN" ]; then echo "CONTESTDOJO_API_TOKEN secret not set; /rooms will use the static rooms.json."; exit 0; fi
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$CONTESTDOJO_API_TOKEN" | kubectl -n bmt exec -i deployment/live -- sh -c 'umask 077 && cat > /app/data/contestdojo.token'
          kubectl -n bmt exec deployment/live -- wget -qO- http://127.0.0.1:3001/api/health
