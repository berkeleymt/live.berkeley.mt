name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy current main to production (configuration/storage reviewed)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: filter
        env:
          LIVE_CONTENT_RUNTIME_RELOAD: ${{ vars.LIVE_CONTENT_RUNTIME_RELOAD }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/content-build-needed.mjs >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # Content-only skips must not cancel an already running code build/deployment.
    concurrency:
      group: ${{ github.workflow }}-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/berkeleymt/live.berkeley.mt
          flavor: latest=true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: image
        with:
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production
    # Optionally attach a protected GitHub Environment; see docs/github-deployment.md.
    permissions:
      contents: read
    concurrency:
      group: live-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and deploy reviewed configuration and exact image
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          LIVE_VARIABLES_JSON: ${{ toJSON(vars) }}
          GH_TOKEN: ${{ github.token }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          CONTESTDOJO_API_TOKEN: ${{ secrets.CONTESTDOJO_API_TOKEN }}
        run: node scripts/deploy-production.mjs