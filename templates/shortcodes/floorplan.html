{% set svg = load_data(path="static/images/" ~ file, format="plain") %}
<figure class="floorplan not-prose my-4" data-building="{{ building }}" data-floor="{{ floor }}">
<figcaption class="flex flex-wrap items-baseline justify-between gap-x-4 text-sm text-gray-600 mb-1"><span class="font-medium text-gray-900">Floor {{ floor }}</span><span class="floorplan-room">Tap a room to see its number.</span></figcaption>
{{ svg | safe }}
</figure>
