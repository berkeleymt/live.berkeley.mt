<details{% if id %} id="{{ id }}"{% endif %} class="group bg-white border border-gray-200 rounded-xl scroll-mt-20 md:scroll-mt-4">
  <summary class="cursor-pointer select-none px-4 py-3 font-medium leading-5 flex items-center justify-between gap-3 list-none [&::-webkit-details-marker]:hidden rounded-xl group-open:rounded-b-none hover:bg-gray-50 transition-colors">
    <span>{{ title }}</span>
    <i class="bi bi-chevron-down text-sm text-gray-400 transition-transform group-open:rotate-180"></i>
  </summary>
  <div class="px-4 pb-3 text-sm text-gray-700 leading-5 [&>p]:my-0 [&>p+p]:mt-2">
    {{ body | markdown | safe }}
  </div>
</details>
