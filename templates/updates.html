{% import "macros.html" as macros %}
{% extends "base.html" %}

{% block content %}
<div class="flex flex-col gap-1">
  <h1 class="text-3xl font-semibold">{{ section.title }}</h1>
  {% if section.description %}<p class="text-gray-500">{{ section.description }}</p>{% endif %}
</div>

{% if section.content %}
<main id="content" class="prose">
  {{ macros::content(html=section.content) }}
</main>
{% endif %}
{% endblock %}
