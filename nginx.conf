# Rate-limit the lookup API per visitor (the ingress sets X-Forwarded-For).
map $http_x_forwarded_for $client_ip {
    default $remote_addr;
    "~^(?P<first>[^,]+)" $first;
}
limit_req_zone $client_ip zone=api:10m rate=2r/s;

server {
    listen 3001;
    listen [::]:3001;
    root /usr/share/nginx/html;
    # Slash redirects (/map -> /map/) must not leak the pod's scheme and port 3001.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /admin/api/login {
        limit_req zone=api burst=5 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:3003;
    }

    location ^~ /admin {
        access_log off;
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:3003;
        proxy_read_timeout 180s;
    }

    location ^~ /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:3002;
        proxy_read_timeout 20s;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
