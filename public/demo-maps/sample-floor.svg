<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title description">
  <title id="title">Demonstration only — fictional ground floor</title>
  <desc id="description">Not a real campus floor plan. Two sample rooms, A101 and A102, connect to a central corridor. A main entrance is below the corridor and a sample step-free entrance is to the left.</desc>
  <rect width="800" height="440" fill="#fafaf7"/>
  <g font-family="system-ui,sans-serif" fill="#142c40">
    <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700">DEMONSTRATION ONLY</text>
    <text x="400" y="60" text-anchor="middle" font-size="16">Fictional building · not Dwinelle · not to scale</text>
    <path d="M95 95H705V315H470M330 315H95V265M95 215V95" fill="none" stroke="#526271" stroke-width="5"/>
    <rect x="115" y="112" width="210" height="90" rx="4" fill="#e5eaed"/>
    <rect x="475" y="112" width="210" height="90" rx="4" fill="#e5eaed"/>
    <text x="220" y="180" text-anchor="middle" font-size="20" font-weight="600">A101 · sample room</text>
    <text x="580" y="180" text-anchor="middle" font-size="20" font-weight="600">A102 · sample room</text>
    <path d="M95 215H195M245 215H555M605 215H705M350 95V215M450 95V215" fill="none" stroke="#526271" stroke-width="4"/>
    <path d="M75 241H220V213M220 241H580V213" fill="none" stroke="#3b7ea1" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="400" y="282" text-anchor="middle" font-size="17">Sample level corridor</text>
    <path d="M400 350V305" fill="none" stroke="#526271" stroke-width="3"/>
    <text x="400" y="379" text-anchor="middle" font-size="18">Main entrance (sample steps)</text>
    <text x="112" y="343" text-anchor="middle" font-size="16">Step-free</text>
    <text x="112" y="364" text-anchor="middle" font-size="16">sample entrance</text>
    <text x="400" y="420" text-anchor="middle" font-size="15">Use this illustration to try the room finder, not to navigate campus.</text>
  </g>
</svg>
